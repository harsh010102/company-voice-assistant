<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Company Analysis — Voice Assistant</title>
  <style>
    :root {
      --bg:#0f1221; --panel:#181c33; --panel2:#1f2442; --text:#e9ecf5; --muted:#9aa3c7;
      --accent:#6c8cff; --accent2:#38d39f; --user:#26305a; --bot:#202544; --danger:#ff6b6b;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      background:radial-gradient(1200px 600px at 70% -10%,#1b2145 0%,var(--bg) 55%);
      color:var(--text); min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:24px 16px 40px;
    }
    header { text-align:center; margin-bottom:14px; }
    header h1 { font-size:20px; margin:0 0 4px; }
    header p { margin:0; color:var(--muted); font-size:13px; }
    .wrap { width:100%; max-width:720px; }
    #log { background:var(--panel); border:1px solid #2a2f52; border-radius:16px; padding:16px;
      height:52vh; min-height:300px; overflow-y:auto; margin-bottom:14px; }
    .msg { display:flex; margin:8px 0; }
    .msg .bubble { max-width:82%; padding:10px 14px; border-radius:14px; line-height:1.45; font-size:15px;
      white-space:pre-wrap; word-wrap:break-word; }
    .msg.user { justify-content:flex-end; }
    .msg.user .bubble { background:var(--user); border-bottom-right-radius:4px; }
    .msg.bot .bubble { background:var(--bot); border-bottom-left-radius:4px; }
    .msg.sys .bubble { background:transparent; color:var(--muted); font-size:13px; font-style:italic; }
    .controls { display:flex; gap:10px; align-items:center; }
    #text { flex:1; background:var(--panel2); border:1px solid #2a2f52; color:var(--text);
      border-radius:12px; padding:13px 14px; font-size:15px; }
    button { border:none; border-radius:12px; cursor:pointer; font-size:15px; font-weight:600; color:#fff; padding:13px 16px; }
    #send { background:var(--accent); }
    #mic { background:var(--accent2); min-width:54px; font-size:20px; }
    #mic.listening { background:var(--danger); animation:pulse 1.1s infinite; }
    @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
    .row2 { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:12px; color:var(--muted); }
    .row2 label { display:flex; gap:6px; align-items:center; cursor:pointer; }
    #status { min-height:16px; }
    .hint { text-align:center; color:var(--muted); font-size:12px; margin-top:16px; line-height:1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>🎙️ Company Analysis — Voice Assistant</h1>
      <p>Ask about <b>Mensch und Maschine</b> or <b>Tyson Foods</b>. Press the mic and speak, or type below.</p>
    </header>

    <div id="log"></div>

    <div class="controls">
      <input id="text" type="text" placeholder="Type a question, or press 🎤 to speak…" autocomplete="off" />
      <button id="send">Send</button>
      <button id="mic" title="Speak your question">🎤</button>
    </div>

    <div class="row2">
      <label><input type="checkbox" id="speak" checked /> Speak answers aloud</label>
      <span id="status"></span>
    </div>

    <p class="hint">
      Voice uses your browser's built-in speech engine (best in Chrome/Edge) — no plugins or keys needed.
    </p>
  </div>

  <script>
    const log = document.getElementById('log');
    const textInput = document.getElementById('text');
    const sendBtn = document.getElementById('send');
    const micBtn = document.getElementById('mic');
    const speakChk = document.getElementById('speak');
    const statusEl = document.getElementById('status');

    // Full conversation history → sent each turn so the assistant keeps context.
    const history = [];

    function addMsg(role, text) {
      const wrap = document.createElement('div');
      wrap.className = 'msg ' + role;
      const b = document.createElement('div');
      b.className = 'bubble';
      b.textContent = text;
      wrap.appendChild(b);
      log.appendChild(wrap);
      log.scrollTop = log.scrollHeight;
      return b;
    }
    const setStatus = (s) => { statusEl.textContent = s; };

    function speak(text) {
      if (!speakChk.checked || !('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.03; u.pitch = 1.0; u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    }

    async function ask(message) {
      message = (message || '').trim();
      if (!message) return;
      addMsg('user', message);
      history.push({ role: 'user', content: message });
      textInput.value = '';
      const thinking = addMsg('bot', '…');
      setStatus('Thinking…');
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
        const reply = data.reply || "Sorry, I didn't get a readable response.";
        thinking.textContent = reply;
        history.push({ role: 'assistant', content: reply });
        setStatus('');
        speak(reply);
      } catch (err) {
        thinking.textContent = '⚠️ ' + err.message;
        setStatus('Error');
      }
    }

    sendBtn.addEventListener('click', () => ask(textInput.value));
    textInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') ask(textInput.value); });

    // Speech-to-text (push to talk)
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
      micBtn.disabled = true; micBtn.style.opacity = 0.4;
      micBtn.title = 'Speech recognition not supported here — please type.';
    } else {
      const recog = new SR();
      recog.lang = 'en-US'; recog.interimResults = false; recog.maxAlternatives = 1;
      let listening = false;
      micBtn.addEventListener('click', () => {
        if (listening) { recog.stop(); return; }
        window.speechSynthesis && window.speechSynthesis.cancel();
        try { recog.start(); } catch (_) {}
      });
      recog.onstart = () => { listening = true; micBtn.classList.add('listening'); setStatus('Listening…'); };
      recog.onend = () => { listening = false; micBtn.classList.remove('listening'); if (statusEl.textContent === 'Listening…') setStatus(''); };
      recog.onerror = (e) => setStatus('Mic error: ' + e.error);
      recog.onresult = (e) => ask(e.results[0][0].transcript);
    }

    addMsg('sys', "Hi! I can tell you about Mensch und Maschine or Tyson Foods — what they do, their products, standing and revenue. What would you like to know?");
  </script>
</body>
</html>
